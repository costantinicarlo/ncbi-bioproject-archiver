name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke test installed wheel CLI
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          pip install dist/*.whl
          python -c "import importlib.metadata as m; assert m.metadata('ncbi-bioproject-archiver')['Name'] == 'ncbi-bioproject-archiver'"
          ncbi-bioproject --help
          ncbi-bioproject manifest --help
          ncbi-bioproject snapshot --help
          ncbi-bioproject validate --help
          ncbi-bioproject verify --help
          ncbi-bioproject status --help
          sra-bioproject --help
          python -m sra_bioproject --help
