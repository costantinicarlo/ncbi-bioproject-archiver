[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ncbi-bioproject-archiver"
version = "0.3.0"
description = "Archive BioProject metadata and download verified lossless SRA data"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ncbi-bioproject = "sra_bioproject.cli:entrypoint"
sra-bioproject = "sra_bioproject.cli:legacy_entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]